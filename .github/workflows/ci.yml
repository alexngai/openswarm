name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

env:
  BUN_VERSION: 1.3.8
  NODE_VERSION: "22"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            compile_script: build:compile:linux-x64
          - os: macos-latest
            compile_script: build:compile:darwin-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        # GITHUB_TOKEN is for @vscode/ripgrep, whose postinstall downloads a
        # platform binary from a GitHub release and reads this variable to
        # authenticate (lib/postinstall.js). Unauthenticated it shares the
        # runner's anonymous rate limit and answers 403, which failed `npm ci` on
        # macos-latest for a month -- so the macOS job never reached a single
        # test, and every macOS defect the parity work later found by hand was
        # one CI had already been asked to catch and could not.
        #
        # Set on both cells rather than only the one that failed: the limit is
        # shared and anonymous, so which runner trips it first is weather.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Check bun.lock freshness
        # Both lockfiles are tracked deliberately: package-lock.json is
        # canonical (CI installs), bun.lock feeds `build:compile`. This step
        # fails when bun.lock is stale against package.json so drift can't
        # ship a binary built from different dependency resolutions.
        run: bun install --frozen-lockfile --dry-run

      - name: Type-check (tsc)
        run: npm run build

      - name: Type-check eval harness
        # eval/ is outside tsconfig.build.json, so drift against swarmkit-eval
        # is invisible to the main build. Keep it honest.
        run: npx tsc -p eval/tsconfig.json --noEmit

      - name: Type-check experimental archive
        # experimental/ holds archived-but-revivable modules (see
        # experimental/BACKLOG.md). Outside tsconfig.build.json; typecheck
        # keeps them importable against the live src/ they depend on.
        run: npx tsc -p experimental/tsconfig.json --noEmit

      - name: Parity manifest gate (WP-01)
        # docs/67 WP-01: fail when a mandatory capability ID has no resolvable
        # evidence owner, when the manifest and the roadmap disagree, or when a
        # public capability claim cites no ID. Cheap and fully offline, so it
        # runs before the expensive suites.
        run: bun scripts/check-parity-manifest.ts

      - name: Build compiled binary (host platform)
        # Build the host-matching binary before running tests so the PTY e2e
        # suite has a packages/cli-<platform>-<arch>/openswarm to spawn.
        # node-pty runs under Node/vitest. Target is per-OS via the matrix.
        run: npm run ${{ matrix.compile_script }}

      - name: Run vitest suite (unit + integration + PTY)
        env:
          OPENSWARM_SKIP_INTEGRATION_BUILD: "1"
        run: npm test

      - name: Run bun test suite (OpenTUI/Solid components)
        env:
          OPENSWARM_SKIP_LIVE: "1"
        run: bun test src/ui/repl-solid/

      - name: Run full smoke (offline)
        run: scripts/smoke-opentui.sh --offline

      - name: Run live smoke (if CLAUDE_CODE_OAUTH_TOKEN is set)
        # Gracefully no-ops when the secret is absent (forks, external PRs).
        # On main-branch pushes from the owner, the secret is available and
        # this step exercises the full live Anthropic API through both the
        # Bun dev CLI and the compiled binary.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN; skipping live smoke."
            exit 0
          fi
          scripts/smoke-opentui.sh

  cache-impact:
    name: Cache-impact guard (TE-27)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the gate can diff HEAD against the PR base.
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        # Authenticated for @vscode/ripgrep's release download; see the test job.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm ci

      - name: Cache-impact gate
        # Reasonix's cache-as-invariant discipline (docs/55 TE-27): a no-op unless the
        # diff touches a cache-sensitive path (transports, compaction, tool specs, the
        # system-prompt/prompt-cache sources); then it re-proves the TE-23 byte-stability
        # and TE-22 cache-accounting guards, so the cacheable prefix can't silently rot.
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha || 'origin/main' }}
        run: bun scripts/check-cache-impact.ts
