name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

env:
  BUN_VERSION: 1.3.8
  NODE_VERSION: "22"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Check bun.lock freshness
        # Both lockfiles are tracked deliberately: package-lock.json is
        # canonical (CI installs), bun.lock feeds `build:compile`. This step
        # fails when bun.lock is stale against package.json so drift can't
        # ship a binary built from different dependency resolutions.
        run: bun install --frozen-lockfile --dry-run

      - name: Type-check (tsc)
        run: npm run build

      - name: Type-check eval harness
        # eval/ is outside tsconfig.build.json, so drift against swarmkit-eval
        # is invisible to the main build. Keep it honest.
        run: npx tsc -p eval/tsconfig.json --noEmit

      - name: Type-check experimental archive
        # experimental/ holds archived-but-revivable modules (see
        # experimental/BACKLOG.md). Outside tsconfig.build.json; typecheck
        # keeps them importable against the live src/ they depend on.
        run: npx tsc -p experimental/tsconfig.json --noEmit

      - name: Build compiled binary (linux-x64)
        # Build the binary before running tests so the PTY e2e suite has
        # a `dist/openswarm` to spawn. node-pty runs under Node/vitest.
        run: npm run build:compile:linux-x64

      - name: Run vitest suite (unit + integration + PTY)
        env:
          OPENSWARM_SKIP_INTEGRATION_BUILD: "1"
        run: npm test

      - name: Run bun test suite (OpenTUI/Solid components)
        env:
          OPENSWARM_SKIP_LIVE: "1"
        run: bun test src/ui/repl-solid/

      - name: Run full smoke (offline)
        run: scripts/smoke-opentui.sh --offline

      - name: Run live smoke (if CLAUDE_CODE_OAUTH_TOKEN is set)
        # Gracefully no-ops when the secret is absent (forks, external PRs).
        # On main-branch pushes from the owner, the secret is available and
        # this step exercises the full live Anthropic API through both the
        # Bun dev CLI and the compiled binary.
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -z "${CLAUDE_CODE_OAUTH_TOKEN:-}" ]; then
            echo "No CLAUDE_CODE_OAUTH_TOKEN; skipping live smoke."
            exit 0
          fi
          scripts/smoke-opentui.sh
