# openswarm-web overlay: the web carrier of the swarm protocol (docs/05 §5.3),
# `swarm/*` as `@Remote` methods on dsh's /api gateway. Layered ABOVE
# openswarm-bundle in the openswarm-web profile only. It treats every caller as
# the owner, so it refuses to load, failing the boot, unless dsh's web server
# binds 127.0.0.1.
- insert:
    - id: openswarm-app-server-web
      name: 'openswarm-app-server/web'

    # The Swarm tab (docs/05 A9): a `dsh.client` package whose browser half
    # dsh's client-modules serves at /plugins/openswarm-swarm-client/client.js.
    - id: openswarm-swarm-client
      name: 'openswarm-swarm-client'

# The socket carrier too, so runs this web process hosts can be directed from
# the CLI (`openswarm start|steer|answer|kill` read `$OPENSWARM_HOME/app-server.json`).
# Port 0: an ephemeral port, never colliding with `openswarm serve`'s 4620.
- id: openswarm-app-server
  disabled: false
  config:
    port: 0
