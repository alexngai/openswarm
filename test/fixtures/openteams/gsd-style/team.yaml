name: gsd-style-fixture
description: "Captured fixture for swarm-harness openteams loader tests. Mirrors a cc-swarm gsd-style topology — coordinator + workers."
version: 1
roles:
  - lead
  - researcher
  - implementer

topology:
  root:
    role: lead
  spawn_rules:
    lead: [researcher, implementer]
    researcher: []
    implementer: []

communication:
  enforcement: permissive
  channels:
    workflow:
      signals: [DONE, BLOCKED]
  subscriptions:
    lead:
      - channel: workflow
  emissions:
    researcher: [DONE]
    implementer: [DONE]
