# compose.parity.yml — the single execution surface for repository
# verification (docs/63 §Per-work-package verification contract).
#
# Every work-package gate runs through one command shape:
#
#   docker compose -f compose.parity.yml run --rm parity \
#     ./scripts/verify-parity-wp.sh <WP> <cell>
#
# The repository is bind-mounted rather than copied, so runs always verify the
# working tree. node_modules and dist are masked by named volumes: the host
# tree carries darwin-arm64 native addons (node-pty, @vscode/ripgrep,
# libopentui) that would segfault under linux/amd64, so the container installs
# and keeps its own.

services:
  parity:
    build:
      context: .
      dockerfile: Dockerfile.parity
    # Pinned so the linux-x64 cell means linux-x64 even on an arm64 host.
    # Expect emulation overhead on Apple silicon.
    platform: linux/amd64
    working_dir: /workspace
    # Reap the child processes the shell/broker fixtures spawn, so orphan
    # assertions measure the code under test and not PID 1 semantics.
    init: true
    volumes:
      - .:/workspace
      - parity-node-modules:/workspace/node_modules
      - parity-dist:/workspace/dist
    environment:
      CI: "1"
      # Defaults keep runs hermetic. Live-provider cells override these
      # explicitly; see docs/63 §Platform matrix.
      OPENSWARM_SKIP_LIVE: "${OPENSWARM_SKIP_LIVE:-1}"
      OPENSWARM_SKIP_INTEGRATION_BUILD: "${OPENSWARM_SKIP_INTEGRATION_BUILD:-1}"
      # Absent by default; populated only for certified live-provider runs.
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      CLAUDE_CODE_OAUTH_TOKEN: "${CLAUDE_CODE_OAUTH_TOKEN:-}"
    command: ["./scripts/verify-parity-wp.sh", "--list"]

volumes:
  parity-node-modules:
  parity-dist:
